name: BIOBUZZ rules

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rules:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install typechecker
        run: python -m pip install mypy==2.4.1
      - name: Typecheck
        run: python -m mypy --ignore-missing-imports --check-untyped-defs control_vision/game/scoreboard.py
      - name: Test
        run: python -m unittest discover -s tests -p test_biobuzz_rules.py -v
      - name: Build source bytecode
        run: python -m compileall -q control_vision/game control_vision/config
