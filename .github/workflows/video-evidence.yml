name: Video evidence utilities

on:
  pull_request:
  push:
    branches: [main]

jobs:
  video-evidence:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-extract.txt
          python -m pip install mypy==2.4.1
      - name: Typecheck
        run: python -m mypy --ignore-missing-imports --check-untyped-defs control_vision/pipeline/clips.py control_vision/pipeline/homography.py control_vision/pipeline/ingest.py control_vision/pipeline/scoreboard_ocr.py
      - name: Test
        run: python -m unittest discover -s tests -p test_video_evidence.py -v
      - name: Build source bytecode
        run: python -m compileall -q control_vision/pipeline
