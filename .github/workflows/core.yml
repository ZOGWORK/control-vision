name: Core scoring

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install typechecker
        run: python -m pip install mypy==2.4.1
      - name: Typecheck
        run: python -m mypy --ignore-missing-imports --check-untyped-defs control_vision/pipeline/cycles.py control_vision/pipeline/stats.py control_vision/pipeline/zones.py control_vision/scout/exports.py
      - name: Test
        run: |
          python -m unittest discover -s tests -p test_core_scoring.py -v
          python -m unittest discover -s tests -p test_pipeline_stats.py -v
      - name: Build source bytecode
        run: python -m compileall -q control_vision/pipeline control_vision/scout
