name: Windows package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the branch commit itself, not the pull request merge commit,
          # so SOURCE.txt names a commit that exists in the repository.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build, smoke test and zip
        shell: pwsh
        env:
          CONTROL_VISION_PYTHON: python
        run: ./scripts/build_windows.ps1
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: build/smoke-report.json
          if-no-files-found: ignore
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v7
        with:
          name: ControlVision-windows-x64
          path: |
            dist/ControlVision-windows-x64-*.zip
            dist/ControlVision-windows-x64-*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
